name: Automated Deployment Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "deploy"
  cancel-in-progress: false

jobs:
  # Job 1: Auto-Deploy full PHP + MySQL site to InfinityFree via FTP
  deploy-infinityfree:
    name: Auto Deploy to InfinityFree Hosting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync Files to InfinityFree htdocs
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftpupload.net
          username: if0_43479474
          password: ${{ secrets.FTP_PASSWORD || 'Datnixs121' }}
          server-dir: htdocs/
          exclude: |
            **/.git*
            **/.git*/**
            README.md
            datnix-solutions-deployment.zip
            scratch/**

  # Job 2: Auto-Deploy static frontend to GitHub Pages
  deploy-github-pages:
    name: Auto Deploy to GitHub Pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
